<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 340" fill="none">
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" fill="#F3EFE8" fill-opacity="0.88" letter-spacing="0.6">

    <!-- Badge 1: 100% Natural -->
    <g transform="translate(0,52)">
      <circle cx="30" cy="0" r="27" stroke="#F3EFE8" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="30" cy="0" r="27" stroke="#F0A63D" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M19 0l7 7 15-16" stroke="#F0A63D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="-6">100% NATURAL</text>
      <text x="68" y="9" fill-opacity="0.55" font-weight="500">Pure Indian produce</text>
    </g>

    <!-- Badge 2: Farm Fresh -->
    <g transform="translate(0,158)">
      <circle cx="30" cy="0" r="27" stroke="#F3EFE8" stroke-opacity="0.45" stroke-width="1.2"/>
      <circle cx="30" cy="0" r="27" stroke="#F0A63D" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M30 10c-9 0-15-6-15-14 8 0 14 3 15 9 1-6 7-9 15-9 0 8-6 14-15 14Z" fill="#9BA968" fill-opacity="0.9"/>
