      <path d="M30 9S18 2 18-6c0-5 4-8 8-8 2 0 3.6 1 4 2.4.4-1.4 2-2.4 4-2.4 4 0 8 3 8 8 0 8-12 15-12 15Z" fill="#D97D2E" fill-opacity="0.85"/>
      <text x="68" y="-6">MADE WITH CARE</text>
