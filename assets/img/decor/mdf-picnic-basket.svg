<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" fill="none">
  <!-- handle -->
  <path d="M92 108C90 66 106 38 130 38s40 28 38 70" stroke="#8A5A2B" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- leafy greens peeking out behind the produce -->
