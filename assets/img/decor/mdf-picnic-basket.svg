    <rect x="112" y="122" width="13" height="13"/>
    <rect x="138" y="122" width="13" height="13"/>
    <rect x="164" y="122" width="13" height="13"/>
    <rect x="190" y="122" width="13" height="13"/>
    <rect x="73" y="135" width="13" height="13"/>
    <rect x="99" y="135" width="13" height="13"/>
    <rect x="125" y="135" width="13" height="13"/>
    <rect x="151" y="135" width="13" height="13"/>
    <rect x="177" y="135" width="13" height="13"/>
