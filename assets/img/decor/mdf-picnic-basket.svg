  <path d="M198 104c8-14 4-30-8-38 0 16 2 28 8 38Z" fill="#7C8A4C"/>
  <path d="M180 96c10-8 22-8 30 0-10 6-20 6-30 0Z" fill="#9BA968"/>

  <!-- bread loaf, diagonal, upper right -->
